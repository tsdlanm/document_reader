name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug assembleRelease

      - name: APK sizes
        run: ls -l app/build/outputs/apk/*/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: document-reader-apk
          path: app/build/outputs/apk/*/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/
